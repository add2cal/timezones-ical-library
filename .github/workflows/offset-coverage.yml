name: Offset coverage

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Build pinned source tools and historical data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offset-source" "$RUNNER_TEMP/offset-zones"
          cd "$RUNNER_TEMP/offset-source"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' -O https://data.iana.org/time-zones/releases/tzdata2026e.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' -O https://data.iana.org/time-zones/releases/tzcode2026e.tar.gz
          printf '%s  %s\n' b26882805f26aac59d5b222978e6580484b834ccdc98be89df2f05a6dc53a652 tzdata2026e.tar.gz cc3d27ca2a0d8399504551b920970d80af83bfb9c216e8082a15491921935d54 tzcode2026e.tar.gz | sha256sum --check --strict
          tar -xzf tzdata2026e.tar.gz
          tar -xzf tzcode2026e.tar.gz
          test "$(cat version)" = 2026e
          make -s zic zdump
          make -s PACKRATDATA=backzone PACKRATLIST= tzdata.zi
          ./zic -b fat -d "$RUNNER_TEMP/offset-zones" tzdata.zi
      - name: Certify source-to-bundle equivalence
        run: |
          python3 scripts/source-offsets.py "$RUNNER_TEMP/offset-zones" "$RUNNER_TEMP/offset-source/zdump" "$RUNNER_TEMP/source-offsets.json"
          node scripts/certify-offsets.cjs "$RUNNER_TEMP/source-offsets.json" "$RUNNER_TEMP/offset-source" "$RUNNER_TEMP/offset-coverage.json"
          if test -f src/db/offset-coverage.json; then
            cmp src/db/offset-coverage.json "$RUNNER_TEMP/offset-coverage.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: offset-coverage
          path: |
            ${{ runner.temp }}/offset-coverage.json
            ${{ runner.temp }}/source-offsets.json
          retention-days: 7
